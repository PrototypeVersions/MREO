<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="MREO: Real Estate, Acquisition, Distribution, and Management Protocol."
  >

  <title>MREO | Real Estate Protocol</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body class="landing">

  <!-- =========================================
       INTRO
       ========================================= -->

  <main>

    <section class="landing-intro">

      <div class="landing-intro-grid">

        <!-- ===================================
             TITLE
             =================================== -->

        <div class="landing-intro-copy">

          <div class="landing-brand">

            <p class="landing-eyebrow">
              Real Estate Protocol
            </p>


            <h1 class="landing-title">
              MREO
            </h1>


            <p class="landing-subtitle">
              Real Estate, Acquisition, Distribution, and Management Protocol
            </p>

          </div>

        </div>


        <!-- ===================================
             BAUHAUS SHAPES
             =================================== -->

        <div
          class="landing-shapes"
          aria-hidden="true"
        >

          <div class="shape-line"></div>

          <div class="shape-square"></div>

          <div class="shape-circle"></div>

        </div>

      </div>

    </section>


    <!-- =========================================
         PRIMARY CHOICE
         ========================================= -->

    <section
      class="landing-choice-grid"
      aria-label="Choose Buy or Sell"
    >

      <!-- =====================================
           BUY
           ===================================== -->

      <a
        class="landing-choice landing-choice-buy"
        href="buy.html"
      >

        <span class="landing-choice-number">
          01
        </span>


        <div class="landing-choice-content">

          <span class="landing-choice-label">
            Buy
          </span>

        </div>


        <span
          class="landing-choice-arrow"
          aria-hidden="true"
        >
          →
        </span>

      </a>


      <!-- =====================================
           SELL
           ===================================== -->

      <a
        class="landing-choice landing-choice-sell"
        href="sell.html"
      >

        <span class="landing-choice-number">
          02
        </span>


        <div class="landing-choice-content">

          <span class="landing-choice-label">
            Sell
          </span>

        </div>


        <span
          class="landing-choice-arrow"
          aria-hidden="true"
        >
          →
        </span>

      </a>

    </section>

  </main>


  <!-- =========================================
       FOOTER
       ========================================= -->

  <footer class="landing-footer">

    <div>
      MREO · <span id="current-year">2026</span>
    </div>


    <div>

      <a href="protocol.html">
        Protocol
      </a>

      <span aria-hidden="true">
        &nbsp;·&nbsp;
      </span>

      <a href="status-disclosure.html">
        Project Status
      </a>

    </div>

  </footer>


  <!-- =========================================
       PAGE LOGIC
       ========================================= -->

  <script>
    (() => {
      "use strict";


      document.getElementById(
        "current-year"
      ).textContent =
        new Date().getFullYear();

    })();
  </script>

</body>
</html>
