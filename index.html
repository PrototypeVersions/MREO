<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="MREO is a real estate acquisition, distribution, coordination, custody, and management protocol."
  >

  <title>MREO | Real Estate Protocol</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body class="landing-page">

  <main class="landing">

    <!-- =========================================
         BRAND / TITLE
         ========================================= -->

    <section class="landing-intro">

      <a
        class="landing-brand"
        href="index.html"
        aria-label="MREO home"
      >
        MREO
      </a>

      <p class="landing-eyebrow">
        Real Estate Protocol
      </p>

      <h1 class="landing-title">
        MREO
      </h1>

      <p class="landing-subtitle">
        Real Estate, Acquisition, Distribution,
        and Management Protocol
      </p>

    </section>


    <!-- =========================================
         TWO ENTRY OPTIONS
         ========================================= -->

    <section
      class="landing-choice-grid"
      aria-label="Choose how to enter MREO"
    >

      <!-- BUY -->

      <a
        class="landing-choice landing-choice-buy"
        href="buy.html"
      >

        <span class="landing-choice-number">
          01
        </span>

        <div class="landing-choice-content">

          <span class="landing-choice-label">
            I want to
          </span>

          <h2>
            Buy
          </h2>

          <p>
            Explore property opportunities and acquisition tools.
          </p>

        </div>

        <span
          class="landing-choice-arrow"
          aria-hidden="true"
        >
          →
        </span>

      </a>


      <!-- SELL -->

      <a
        class="landing-choice landing-choice-sell"
        href="sell.html"
      >

        <span class="landing-choice-number">
          02
        </span>

        <div class="landing-choice-content">

          <span class="landing-choice-label">
            I want to
          </span>

          <h2>
            Sell
          </h2>

          <p>
            Analyze a property and compare possible paths forward.
          </p>

        </div>

        <span
          class="landing-choice-arrow"
          aria-hidden="true"
        >
          →
        </span>

      </a>

    </section>


    <!-- =========================================
         MINIMAL FOOTER
         ========================================= -->

    <footer class="landing-footer">

      <p>
        Demonstration prototype
      </p>

      <p>
        MREO
        <span aria-hidden="true">·</span>
        <span id="current-year">2026</span>
      </p>

    </footer>

  </main>


  <script>
    document.getElementById("current-year").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
